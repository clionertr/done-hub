name: Sync Upstream

on:
  schedule:
    # 每天北京时间 10:00 自动同步上游（UTC 02:00）
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/deanxv/done-hub.git
          git fetch upstream main

      - name: Merge upstream into fork main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge upstream/main --no-edit
          git push origin main

      - name: Merge upstream into feature branch
        run: |
          git checkout opencode-go-flash-raw
          git merge upstream/main --no-edit
          git push origin opencode-go-flash-raw
